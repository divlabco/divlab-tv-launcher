name: Build APK
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - name: Decode keystore
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ยังไม่ได้ตั้ง secret KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk divlab-launcher.apk
      - uses: actions/upload-artifact@v5
        with: { name: divlab-launcher, path: divlab-launcher.apk }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: divlab-launcher.apk }
